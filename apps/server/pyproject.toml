[project]
name = "xavier"
version = "0.1.0"
description = "Agent platform: Observe, Execute, Compute"
authors = [{ name = "machnevegor", email = "egorikhelp@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=15.5.0",
    "aiodocker>=0.27.0",
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "deepseek-harness-sdk==0.2.2rc2",
    "fastapi>=0.163.1",
    "fastapi-derive-responses>=0.1.7",
    "fastapi-swagger>=0.4.66",
    "httpx2>=2.16.0",
    "jsonpath-ng>=1.16.0",
    "jsonschema>=4.26.0",
    "mcp>=2.3.0",
    "opentelemetry-exporter-otlp>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.3",
    "pydantic-settings[yaml]>=2.16.3",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "selectolax>=1.0.2",
    "sqlalchemy[asyncio]>=2.1.8",
    "sse-starlette>=3.7.0",
    "temporalio[aioboto3,pydantic]>=1.36.1",
    "uvicorn>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
xavier = "src.__main__:main"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "src"
module-root = ""

[dependency-groups]
dev = [
    "pillow>=13.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.5",
    "ty>=0.0.104",
    "types-aioboto3[s3]>=15.5.0",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # conflicts with the formatter
    "CPY001", # no per-file copyright headers
    "TC",     # annotations are deferred; Pydantic and FastAPI resolve them at runtime
    "EM101",  # inline exception messages are clearer than a temporary variable
    "EM102",
    "TRY003",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",
    "S105",
    "S106",
    "D",
    "PLR2004",
    "INP001",
    "ARG002",  # fakes implement interfaces whose arguments they ignore
]
"src/db/migrations/**" = ["INP001"]
# Schema docstrings are OpenAPI descriptions: "This object represents a chat".
"src/api/**/schemas.py" = ["D404"]
"src/api/common.py" = ["D404"]
# Standalone programs of the container images: fixed paths inside the container, and a
# single-client daemon whose file calls touch local tmpfs.
"images/**" = ["INP001", "S108", "ASYNC230", "ASYNC240"]

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = [
    "--strict-markers",
    "--disable-socket",
    "--allow-unix-socket",
    "-m",
    "not integration",
]
markers = ["integration: requires the stack from docker-compose.test.yaml"]
