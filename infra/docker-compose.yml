# This is a Docker Compose configuration for the local infrastructure.

# Run all services with:
#   docker compose -f infra/docker-compose.yml up -d
# Tear everything down (including data volumes) with:
#   docker compose -f infra/docker-compose.yml down -v

# Service map:
#   PostgreSQL
#     Endpoint:    localhost:5432
#     Protocol:    PostgreSQL
#     Username:    postgres
#     Password:    postgres
#   Temporal
#     Endpoint:    localhost:7233
#     Protocol:    gRPC
#   Temporal UI
#     Endpoint:    http://localhost:8233
#     Protocol:    HTTP
#   RustFS S3 API
#     Endpoint:    http://localhost:9000
#     Protocol:    HTTP (S3)
#     Access key:  xavier
#     Secret key:  xavier-secret
#   RustFS Console
#     Endpoint:    http://localhost:9001
#     Protocol:    HTTP

name: xavier-infra

services:
  postgres:
    image: postgres:18.7-trixie
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      XAVIER_DB_PASSWORD: ${XAVIER_DB_PASSWORD:-xavier}
      TEMPORAL_DB_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ../scripts/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - 127.0.0.1:5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 1g

  temporal-setup-postgres:
    image: temporalio/admin-tools:1.32.2
    entrypoint: ["/bin/sh", "/scripts/temporal-setup-postgres.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQL_PASSWORD: ${TEMPORAL_DB_PASSWORD:-temporal}
    volumes:
      - ../scripts/temporal:/scripts:ro

  temporal:
    image: temporalio/server:1.32.2
    depends_on:
      temporal-setup-postgres:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${TEMPORAL_DB_PASSWORD:-temporal}
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig.yaml
    volumes:
      - ../scripts/temporal/dynamicconfig.yaml:/etc/temporal/dynamicconfig.yaml:ro
    ports:
      - 127.0.0.1:7233:7233
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  temporal-create-namespace:
    image: temporalio/admin-tools:1.32.2
    entrypoint: ["/bin/sh", "/scripts/temporal-create-namespace.sh"]
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      - ../scripts/temporal:/scripts:ro

  temporal-ui:
    image: temporalio/ui:2.58.1
    depends_on:
      temporal:
        condition: service_healthy
    restart: unless-stopped
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - 127.0.0.1:8233:8080
    deploy:
      resources:
        limits:
          memory: 256m

  rustfs:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-xavier}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-xavier-secret}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    volumes:
      - rustfs-data:/data
    ports:
      - 127.0.0.1:9000:9000
      - 127.0.0.1:9001:9001
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1g

networks:
  default:
    name: xavier

volumes:
  postgres-data:
  rustfs-data:
